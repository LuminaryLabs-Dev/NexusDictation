name: Browser ESM tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 -m py_compile native/bridge.py
